factory:
  title: The Factory
  lead: One roof, from raw board to export crate. Owning every stage is how we control quality and programme.
  zones:
    - name: Engineering
      text: Shop drawings and cutting lists produced from your approved design.
    - name: Machining
      text: Panel saws, edgebanders and boring machines for repeatable precision.
    - name: Veneer
      text: Veneer selection, laying and hot pressing onto panels.
    - name: Finishing
      text: Spray booths for lacquer and paint finishes, matched to approved samples.
    - name: Assembly & QC
      text: Pre-assembly and dry-fitting, checked against drawings before anything is packed.
    - name: Export Packing
      text: Crated, labelled by room and sequence, ready for container shipping.
  photo:
    src: /assets/craft/factory-jointer.jpg
    alt: Craftsmen straightening timber on the jointer, Numa Living factory, Dubai
    caption: The factory floor, Dubai
