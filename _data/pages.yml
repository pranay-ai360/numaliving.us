# The Page registry: one entry per static page, read by the page head, the sitemap and the tests.
# Projects keep their title and description in _projects/. A description is 50 to 160 characters,
# unique, and comes from the page's own text. Demo Portal descriptions say first that they are a demo,
# because those pages are indexed and show invented figures.
- url: /
  title: "Numa Living | Bespoke millwork, built for the world"
  description: Numa Living crafts panelled walls, kitchens, wardrobes, doors and statement pieces, engineered in-house and installed anywhere in the world.
