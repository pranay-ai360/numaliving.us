{%- comment -%} Inner-page hero: linen band, gold line-art, title. Params: eyebrow, title, lead. {%- endcomment -%}
<section class="linen relative overflow-hidden">
  {% include line-art.html class="pointer-events-none absolute inset-x-0 bottom-0 h-full w-full text-gold/25" %}
  <div class="relative mx-auto max-w-7xl px-4 py-20 sm:px-6 sm:py-28">
    <p class="eyebrow">{{ include.eyebrow }}</p>
    <h1 class="display mt-4 max-w-3xl text-3xl sm:text-5xl">{{ include.title }}</h1>
    <p class="mt-6 max-w-2xl text-lg leading-relaxed text-ink-muted">{{ include.lead }}</p>
  </div>
</section>
