{%- comment -%} Laptop and phone showing screenshots of the Demo Portal. To update them, replace the two files and keep their names. {%- endcomment -%}
<div class="relative mx-auto w-full max-w-[640px] sm:pb-[6%]">
  <div class="hidden w-[88%] sm:block">
    <div class="overflow-hidden rounded-t-[14px] rounded-b-sm border-[10px] border-b-[14px] border-[#2e2b27] bg-black">
      <img src="{{ '/assets/portal-preview/portal-desktop.jpg' | relative_url }}" alt="The Numa client portal on a laptop: project stage, approvals waiting, open RFIs and the latest factory updates" class="block aspect-[1440/820] w-full object-cover object-top" loading="lazy" decoding="async">
    </div>
    <div class="relative -mx-[6%] h-3.5 rounded-b-[12px] bg-gradient-to-b from-[#3a3631] to-[#24221f]">
      <span class="absolute left-1/2 top-0 h-1.5 w-24 -translate-x-1/2 rounded-b-md bg-[#1a1816]"></span>
    </div>
  </div>
  <div class="mx-auto w-[220px] overflow-hidden rounded-[28px] border-[8px] border-[#2e2b27] bg-black shadow-[0_24px_50px_rgba(0,0,0,0.5)] sm:absolute sm:bottom-0 sm:right-0 sm:w-[27%]">
    <img src="{{ '/assets/portal-preview/portal-mobile.jpg' | relative_url }}" alt="The same project on a phone" class="block aspect-[390/844] w-full object-cover object-top" loading="lazy" decoding="async">
  </div>
</div>
