<header class="sticky top-0 z-40 bg-paper/95 shadow-[0_6px_24px_rgba(0,0,0,0.04)] backdrop-blur">
  <div class="mx-auto flex h-20 max-w-7xl items-center justify-between gap-6 px-4 sm:px-6 lg:h-24">
    <a href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home" class="shrink-0">{% include wordmark.html %}</a>

    <nav aria-label="Main" class="hidden items-center gap-6 xl:flex">
      {% for item in site.data.site.nav %}
        {% include nav-active.html href=item.href %}
        <a href="{{ item.href | relative_url }}" class="text-[0.95rem] transition-colors hover:text-gold {% if is_active %}text-gold{% else %}text-ink{% endif %}">{{ item.label }}</a>
      {% endfor %}
      <a href="{{ '/login/' | relative_url }}" class="rounded-sm border border-gold px-4 py-2 text-sm font-medium text-gold transition-colors hover:bg-gold hover:text-white">Client Login</a>
    </nav>

    <button type="button" class="flex h-11 w-11 items-center justify-center xl:hidden" aria-expanded="false" aria-controls="mobile-nav" aria-label="Open menu" data-menu-button>
      <span class="relative block h-3.5 w-6">
        <span class="absolute left-0 h-px w-6 bg-ink transition-transform top-0" data-closed="top-0" data-open="top-1.5 rotate-45"></span>
        <span class="absolute left-0 top-1.5 h-px w-6 bg-ink transition-opacity" data-closed="" data-open="opacity-0"></span>
        <span class="absolute left-0 h-px w-6 bg-ink transition-transform top-3" data-closed="top-3" data-open="top-1.5 -rotate-45"></span>
      </span>
    </button>
  </div>

  <nav id="mobile-nav" aria-label="Mobile" class="border-t border-line bg-paper px-4 pb-6 xl:hidden" hidden>
    {% for item in site.data.site.nav %}
      {% include nav-active.html href=item.href %}
      <a href="{{ item.href | relative_url }}" class="block border-b border-line py-3.5 {% if is_active %}text-gold{% else %}text-ink{% endif %}">{{ item.label }}</a>
    {% endfor %}
    <a href="{{ '/login/' | relative_url }}" class="mt-5 block rounded-sm bg-gold py-3 text-center font-medium text-white">Client Login</a>
  </nav>
</header>
