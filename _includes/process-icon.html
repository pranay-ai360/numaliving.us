{%- comment -%} Line icons for the Process diagram, on a 24 x 24 grid in the current text colour. Param: name, class. {%- endcomment -%}
<svg viewBox="0 0 24 24" class="{{ include.class }}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- case include.name -%}
  {%- when "responsibilities" -%}
  <rect x="5.5" y="4.5" width="13" height="16" rx="2"></rect><path d="M9 4.5h6v3H9z"></path><path d="M9 13l2 2 4-4.5"></path>
  {%- when "drawings" -%}
  <rect x="3.5" y="4.5" width="17" height="15" rx="1.5"></rect><path d="M3.5 9.5h17M9.5 9.5v10"></path><path d="M13 13.5h4M13 16.5h2.5"></path>
  {%- when "samples" -%}
  <rect x="4.5" y="3.5" width="15" height="17" rx="2"></rect><rect x="7.5" y="6.5" width="9" height="6" rx="1"></rect><path d="M7.5 16h5.5"></path>
  {%- when "production" -%}
  <circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="6.5"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path>
  {%- when "quality" -%}
  <circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path><path d="M7.8 10.6l2 2 3.5-4"></path>
  {%- when "shipping" -%}
  <path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5v-9z"></path><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"></path>
  {%- when "handover" -%}
  <path d="M3.5 11L12 4l8.5 7"></path><path d="M6 9.5V20h12V9.5"></path><path d="M9.5 14.5l1.8 1.8 3.4-3.6"></path>
  {%- else -%}
  <path d="M4 20h4L19.5 8.5l-4-4L4 16v4z"></path><path d="M13 7l4 4"></path>
  {%- endcase -%}
</svg>
