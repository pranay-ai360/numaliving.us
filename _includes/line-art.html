{%- comment -%} Thin gold line-art of joinery elevations: wall panels, a tall wardrobe, a door, a kitchen run. {%- endcomment -%}
<svg viewBox="0 0 1200 420" class="{{ include.class }}"{% if include.style %} style="{{ include.style }}"{% endif %} fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" preserveAspectRatio="xMidYMax slice">
  <rect x="20" y="60" width="200" height="360"></rect>
  {%- for x in (2..10) %}
  <line x1="{{ x | times: 20 }}" y1="60" x2="{{ x | times: 20 }}" y2="420"></line>
  {%- endfor %}
  <rect x="250" y="20" width="260" height="400"></rect>
  <line x1="380" y1="20" x2="380" y2="420"></line>
  <rect x="270" y="40" width="90" height="230"></rect>
  <rect x="400" y="40" width="90" height="230"></rect>
  <rect x="270" y="290" width="90" height="110"></rect>
  <rect x="400" y="290" width="90" height="110"></rect>
  <line x1="368" y1="190" x2="368" y2="250"></line>
  <line x1="392" y1="190" x2="392" y2="250"></line>
  <polyline points="560,420 560,90 700,60 700,420"></polyline>
  <polyline points="580,420 580,110 680,88 680,420"></polyline>
  <line x1="590" y1="250" x2="600" y2="248"></line>
  <rect x="740" y="110" width="420" height="110"></rect>
  {%- for k in (0..5) %}
  {%- assign x = k | times: 70 | plus: 810 %}
  <line x1="{{ x }}" y1="110" x2="{{ x }}" y2="220"></line>
  {%- endfor %}
  <polyline points="720,420 760,330 1140,330 1180,420"></polyline>
  <line x1="760" y1="330" x2="760" y2="420"></line>
  <line x1="1140" y1="330" x2="1140" y2="420"></line>
  <line x1="740" y1="345" x2="1160" y2="345"></line>
</svg>
