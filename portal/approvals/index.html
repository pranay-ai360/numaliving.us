---
view: approvals
---
{% include portal-title.html eyebrow="Approvals" title="Drawings & Samples" %}
<div role="tablist" aria-label="Approval type" class="mb-6 flex flex-wrap gap-1 border-b border-line" x-effect="startAfresh(current?.key)">
  <template x-for="option in visible" :key="option.key">
    <button type="button" role="tab" :aria-selected="current?.key === option.key" @click="tab = option.key" class="-mb-px min-h-11 px-4 text-sm" :class="current?.key === option.key ? 'border-b-2 border-gold font-bold text-ink' : 'text-ink-muted hover:text-ink'" x-text="option.label"></button>
  </template>
</div>
<template x-if="!current">
  <p class="text-ink-muted">You do not have access to drawings or samples on this project.</p>
</template>

<template x-if="current && current.key !== 'design'">
  <div class="grid items-start gap-5 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.6fr)]">
    <ul aria-label="Items" class="border border-line bg-paper">
      <template x-for="item in items" :key="item.id">
        <li>
          <button type="button" :aria-pressed="item.id === selected.id" @click="selectedId = item.id" class="flex w-full items-center gap-3 border-b border-[#efeae1] px-4 py-3.5 text-left" :class="item.id === selected.id ? 'bg-[#faf6ee] shadow-[inset_3px_0_0_var(--brand-gold)]' : 'bg-paper hover:bg-[#fcfaf6]'">
            <template x-if="item.swatch"><span aria-hidden="true" class="h-9 w-9 shrink-0" :style="{ background: item.swatch }"></span></template>
            <span class="min-w-0 flex-1">
              <span class="block text-sm font-semibold" x-text="item.code"></span>
              <span class="block text-xs text-ink-muted" x-text="item.title"></span>
            </span>
            <span :class="badge(item).className" x-text="badge(item).label"></span>
          </button>
        </li>
      </template>
    </ul>

    <section aria-label="Review" class="border border-line bg-paper">
      <div class="flex flex-wrap items-baseline justify-between gap-3 border-b border-line px-5 py-4">
        <div>
          <h2 class="font-bold" x-text="`${selected.code} · ${selected.title}`"></h2>
          <p class="mt-1 text-xs text-ink-muted" x-text="selected.sub"></p>
        </div>
        <span class="text-sm font-semibold text-gold-dark" x-text="selected.kind === 'shop' ? 'Open full PDF' : 'See all photos'"></span>
      </div>

      <template x-if="selected.kind === 'shop'">
        <div class="mx-5 mt-5 flex h-56 items-center justify-center border border-line bg-[#fbfaf7]">
          <svg role="img" :aria-label="`Preview of shop drawing ${selected.code}, ${selected.title}`" viewBox="0 0 500 220" class="h-auto w-[82%] text-ink-muted">
            <g fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="40" y="60" width="400" height="120"></rect>
              <line x1="40" y1="78" x2="440" y2="78"></line>
              <line x1="140" y1="78" x2="140" y2="180"></line>
              <line x1="240" y1="78" x2="240" y2="180"></line>
              <line x1="340" y1="78" x2="340" y2="180"></line>
              <line x1="128" y1="120" x2="128" y2="140"></line>
              <line x1="152" y1="120" x2="152" y2="140"></line>
              <line x1="328" y1="120" x2="328" y2="140"></line>
              <line x1="352" y1="120" x2="352" y2="140"></line>
              <line x1="40" y1="200" x2="440" y2="200" stroke-dasharray="4 4"></line>
              <line x1="460" y1="60" x2="460" y2="180" stroke-dasharray="4 4"></line>
            </g>
            <text x="240" y="214" text-anchor="middle" font-size="11" fill="currentColor">3200</text>
            <text x="464" y="124" font-size="11" fill="currentColor">920</text>
            <text x="40" y="40" font-size="11" fill="var(--brand-gold-dark)">ELEVATION A · 1:20 · SAMPLE</text>
          </svg>
        </div>
      </template>
      <template x-if="selected.kind !== 'shop'">
        <div class="mx-5 mt-5 flex flex-wrap gap-5">
          <div role="img" :aria-label="`Photo of the ${selected.code} sample`" class="h-56 min-w-[200px] flex-1" :style="{ background: selected.swatch }"></div>
          <dl class="grid flex-1 grid-cols-[auto_1fr] content-start gap-x-4 gap-y-2 text-sm">
            <dt class="text-ink-muted">Sample</dt>
            <dd x-text="selected.code"></dd>
            <dt class="text-ink-muted">Where</dt>
            <dd x-text="selected.title"></dd>
            <dt class="text-ink-muted">Physical</dt>
            <dd>Delivered to site office</dd>
          </dl>
        </div>
      </template>

      <div class="flex flex-col gap-3 p-5">
        <template x-if="decided">
          <p role="status" class="bg-gold-soft px-4 py-3 text-sm font-semibold" x-text="`${decided}. Numa has been notified${decided.startsWith('Revise') ? ' and will issue the next revision.' : '.'}`"></p>
        </template>
        <template x-if="isWaiting && canApprove">
          <div class="contents">
            <label for="note" class="text-sm font-semibold">Comments (optional)</label>
            <textarea id="note" rows="2" x-model="note" placeholder="e.g. Increase the overhang to 300 mm on the seating side." class="w-full border border-[#cfc7b8] px-3 py-2.5 text-sm outline-none focus:border-gold"></textarea>
            <div class="flex flex-wrap gap-2.5">
              <button type="button" @click="decide(note ? 'Approved with comments' : 'Approved')" class="min-h-11 bg-gold px-5 text-sm font-semibold text-white hover:bg-gold-dark">Approve</button>
              <button type="button" @click="decide('Revise & resubmit')" class="min-h-11 border border-[#cfc7b8] px-5 text-sm font-semibold hover:border-ink">Revise &amp; resubmit</button>
            </div>
          </div>
        </template>
        <template x-if="isWaiting && !canApprove">
          <p class="bg-[#faf8f4] px-4 py-3 text-sm text-ink-muted" x-text="`You can view this. Approval sits with ${approvers}.`"></p>
        </template>
        <template x-if="!decided && selected.status !== 'waiting'">
          <p class="text-sm text-ink-muted">No action needed.</p>
        </template>
      </div>
    </section>
  </div>
</template>

<template x-if="current && current.key === 'design'">
  <div class="flex flex-col gap-5">
    <template x-if="canUpload">
      <label class="flex min-h-36 cursor-pointer flex-col items-center justify-center gap-2 border-[1.5px] border-dashed border-gold bg-paper px-4 text-center">
        <span class="font-semibold">Choose PDF drawings to upload</span>
        <span class="text-xs text-ink-muted">PDF only · versioned, nothing is overwritten · demo: the file stays on your computer</span>
        <input type="file" accept="application/pdf" multiple @change="onPick($event)" class="text-xs">
      </label>
    </template>
    <template x-if="!canUpload">
      <p class="bg-paper px-4 py-3 text-sm text-ink-muted">You can view design drawings. Uploading is set on Team &amp; access.</p>
    </template>
    <div class="overflow-x-auto border border-line bg-paper">
      <table class="w-full min-w-[600px] text-sm">
        <thead>
          <tr class="text-left text-[11px] uppercase tracking-[0.12em] text-ink-muted">
            <th scope="col" class="border-b border-line px-5 py-3 font-semibold">Drawing</th>
            <th scope="col" class="border-b border-line px-2 py-3 font-semibold">Version</th>
            <th scope="col" class="border-b border-line px-2 py-3 font-semibold">Uploaded by</th>
            <th scope="col" class="border-b border-line px-5 py-3 font-semibold">Date</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(file, index) in files" :key="`${file.name}-${index}`">
            <tr>
              <td class="border-b border-[#efeae1] px-5 py-3 font-semibold" x-text="file.name"></td>
              <td class="border-b border-[#efeae1] px-2 py-3" x-text="file.version"></td>
              <td class="border-b border-[#efeae1] px-2 py-3 text-ink-muted" x-text="file.by"></td>
              <td class="border-b border-[#efeae1] px-5 py-3 text-ink-muted" x-text="file.date"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>
</template>
