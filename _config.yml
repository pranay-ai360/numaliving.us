# GitHub Pages builds this site with Jekyll on every push to main (github-pages 232, Jekyll 3.10).
# Anything not excluded below gets published, so a new root file or folder needs an entry here.
# e2e/published-files.spec.ts fails if one is missed.
title: Numa Living
tagline: Bespoke millwork, built for the world
description: Numa Living designs, engineers and manufactures luxury joinery and millwork for residences, workplaces and multifamily buildings, and delivers it worldwide.
url: https://numaliving.us
# The site lives at the domain root. A value here is respected as it is; left unset, the build would ask GitHub.
baseurl: ""
# Without this, GitHub adds its default theme and its stylesheet to the site.
theme: false

# The FormSubmit alias Quote Requests post to. It is public by design: it is in every page's source anyway.
formsubmit_id: c95b560aaf0b2ae025507ec7e32335ba

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      type: projects
    values:
      layout: project
  - scope:
      path: portal
    values:
      layout: portal
      scripts:
        - portal/app.js
        - vendor/alpine-3.17.5.min.js

# This list replaces Jekyll's defaults, so it must be complete.
exclude:
  - CNAME
  - CONTEXT.md
  - README.md
  - docs/
  - e2e/
  - tests/
  - scripts/
  - reference-site/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - tsconfig.json
  - eslint.config.mjs
  - playwright.config.ts
  - vitest.config.mts
  - coverage/
  - playwright-report/
  - test-results/
